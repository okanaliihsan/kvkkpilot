<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KVKKpilot · Uygulama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23C0322B' stroke-width='3'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%23C0322B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
main{padding-block:28px 40px}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px}
.pagehead h1{font-size:clamp(26px,3.4vw,34px);font-weight:800}
.crumb{font-size:13px;color:var(--ink-2);text-decoration:none}
.crumb:hover{color:var(--ink)}
/* Pano */
.biz{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bizcard{padding:20px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;transition:border-color .15s}
.bizcard:hover{border-color:var(--ink-2)}
.bizcard .top{display:flex;gap:14px;align-items:center}
.bizcard h3{font-size:17px}
.bizcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.mini{width:58px;height:58px;flex:none;position:relative}
.mini svg{width:58px;height:58px;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.newcard{border-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:160px;color:var(--ink-2)}
.newcard b{font-size:28px;color:var(--seal);font-family:var(--f-display)}
/* Sihirbaz */
.wizard{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.progress div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.progress i{display:block;height:5px;border-radius:3px;background:var(--line)}
.progress .on i{background:var(--seal)}
.progress .on{color:var(--ink)}
@media (max-width:560px){.progress span{display:none}}
.step{padding:26px;display:flex;flex-direction:column;gap:16px}
.step h2{font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:8px}
.wnav{display:flex;justify-content:space-between;gap:10px}
.err{color:var(--bad);font-size:13px;margin:0}
/* Çalışma alanı */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs a{padding:12px 14px;font-size:14.5px;font-weight:600;color:var(--ink-2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--seal)}
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:24px}
@media (max-width:600px){.summary{grid-template-columns:1fr}}
.gauge{position:relative;width:150px;height:150px}
.gauge svg{width:150px;height:150px;transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge b{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.gauge small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.arc{transition:stroke-dashoffset .6s ease}
.verdict h2{font-size:23px;margin-bottom:6px}
.verdict p{margin:0;color:var(--ink-2);max-width:62ch}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:14px;max-width:420px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-block:16px}
@media (max-width:720px){.stats{grid-template-columns:1fr}}
.stat{padding:16px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px}
.sechead h3{font-size:19px}
.actions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.actions li{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 0;background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.actions li::before{content:"";align-self:stretch;background:var(--sev)}
.actions li.hi{--sev:var(--bad)}.actions li.md{--sev:var(--warn)}.actions li.lo{--sev:var(--ok)}
.actions b{display:block;font-size:14.5px}
.actions span{font-size:13.5px;color:var(--ink-2)}
.actions code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.actions .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:560px){.actions li{grid-template-columns:5px 1fr}.actions .right{grid-column:2;align-items:flex-start;flex-direction:row}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.doctabs{display:flex;flex-wrap:wrap;gap:6px}
.doctabs button{padding:7px 13px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;font-size:13.5px;color:var(--ink)}
.doctabs button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.doc{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:6px;padding:32px clamp(18px,4vw,48px);font-size:14.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto}
.status{font-size:13.5px;color:var(--ink-2);min-height:20px}
.status.err{color:var(--bad)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.checks{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;font-size:14px}
.chk .ic{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.chk.y .ic{background:var(--ok-soft);color:var(--ok)}.chk.n .ic{background:var(--bad-soft);color:var(--bad)}
.chk small{display:block;color:var(--ink-2);font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px;max-height:55vh;overflow:auto;padding:16px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--navy);color:var(--paper);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;color:var(--ink)}
.offai{padding:16px 18px;border:1px dashed var(--line);border-radius:8px;font-size:14px;color:var(--ink-2)}
.disclaimer{font-size:12.5px;color:var(--ink-2);margin-top:22px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:Georgia,serif;font-size:11.5pt;line-height:1.55;color:#000;white-space:pre-wrap}
  #print h1{font-family:Georgia,serif;font-size:15pt;margin:0 0 4pt}
  #print .ph{font-size:9pt;color:#555;border-bottom:1px solid #999;padding-bottom:6pt;margin-bottom:14pt;white-space:normal}
}
</style>
</head>
